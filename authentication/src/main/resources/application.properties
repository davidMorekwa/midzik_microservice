spring.application.name=authentication
server.port=8082
# mysql
# spring.datasource.url=jdbc:mysql://localhost:3306/midzik_authentication_microservice?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.url=jdbc:mysql://mysql:3307/midzik_microservice?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=midzik_admin
spring.datasource.password=password
# spring.sql.init.mode=always
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql: true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#hibernate
spring.jpa.hibernate.ddl-auto=none
# Schema-exporter
spring.jpa.properties.javax.persistence.schema-generation.scripts.action=create
spring.jpa.properties.javax.persistence.schema-generation.scripts.create-target=create_script.sql
#devtools
#spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=2000
# jwt
security.jwt.secret-
# 1h in millisecond
security.jwt.expiration-time=3600000
#loggin
# logging.level.org.springframework=DEBUG
# logging.level.org.springframework.cloud.netflix.eureka=ERROR
#logging.level.root=DEBUG

#eureka-client
# eureka.client.service-url.defaultZone=http://localhost:8761/eureka 
eureka.client.service-url.defaultZone=http://registry:8761/eureka 
eureka.client.enabled=false
#Kafka
spring.kafka.admin.client-id=midzik-authentication-microservice
spring.kafka.admin.bootstrap-servers=broker:29092
#Sprinng cloud config client
spring.cloud.config.uri=http://localhost:8888
spring.config.import=optional:configserver:http://localhost:8888