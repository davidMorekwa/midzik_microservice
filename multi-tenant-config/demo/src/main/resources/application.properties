spring.application.name=config
spring.cloud.config.server.git.uri: https://github.com/MidZikLabs/multi-tenant.git
spring.cloud.config.server.git.clone-on-start=true

server.port=8888

logging.level.org.springframework.cloud.config: DEBUG

# spring.config.import=optional:configserver:http://localhost:8888
eureka.client.service-url.defaultZone=http://registry:8761/eureka
# eureka.client.service-url.defaultZone=http://localhost:8761/eureka
# eureka.client.enabled=false

#cors
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*

