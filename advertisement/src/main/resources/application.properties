spring.application.name=advertisement
server.port=8081
file.upload-dir=uploads/

#MYSQL 
spring.jpa.hibernate.ddl-auto=update
# spring.datasource.url=jdbc:mysql://localhost:3306/midzik_advertisement_microservice?allowPublicKeyRetrieval=true&useSSL=false
# # spring.datasource.url=jdbc:mysql://mysql:3306/midzik_advertisement_microservice?allowPublicKeyRetrieval=true&useSSL=false
# spring.datasource.username=midzik_admin
# spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql: true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# spring.sql.init.mode=always

#Devtools
spring.devtools.livereload.enabled=true
spring.devtools.restart.poll-interval=1000
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java, src/main/resources

#JWT
security.jwt.secret-

#Logging 
# logging.level.org.springframework.web=DEBUG
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate=DEBUG
# logging.root=DEBUG
# logging.level.org.springframework.cloud.netflix.eureka=ERROR
logging.level.org.apache.kafka.clients=ERROR
logging.level.org.springframework.kafka=ERROR

#Eureka
eureka.client.service-url.defaultZone=http://registry:8761/eureka
# eureka.client.service-url.defaultZone=http://localhost:8761/eureka
# eureka.client.enabled=false

#Kafka
spring.kafka.bootstrap-servers=broker:29092
# spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=advertisement

#spring cloud config client
spring.cloud.config.uri=http://config:8888
# spring.cloud.config.uri=http://localhost:8888
spring.config.import=optional:configserver:http://config:8888
# spring.config.import=optional:configserver:http://localhost:8888